[project]
name = "ngp-ml"
version = "0.1.0"
description = "Not Google Photos ML service: face detection and embeddings plus multilingual CLIP embeddings over HTTP (FastAPI + ONNX Runtime)."
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "uvloop>=0.21; sys_platform != 'win32'",
    "httptools>=0.6",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "orjson>=3.10",
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=11.0",
    "pillow-heif>=1.0",
    "opencv-python-headless>=4.10",
    "tokenizers>=0.20",
]

[project.scripts]
ngp-ml = "ngp_ml.cli:main"

[dependency-groups]
# ONNX Runtime comes from exactly one of these groups. `cpu` is the default and
# also carries the CoreML execution provider in the macOS arm64 wheel.
cpu = ["onnxruntime>=1.22"]
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.22; sys_platform == 'linux'"]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyarrow>=17",
]

[tool.uv]
default-groups = ["cpu", "dev"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs the real ONNX models (downloaded into ML_CACHE_DIR on first use)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
