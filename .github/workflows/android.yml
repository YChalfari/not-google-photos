name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/photo-sync/**'
      - 'packages/shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @ngp/web build

      - name: Copy the web app into the Android project
        run: pnpm --filter @ngp/mobile exec cap sync android

      - name: Require the release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Set the ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Set the ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Set the ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Set the ANDROID_KEY_PASSWORD secret"; exit 1; }

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Version name
        id: version
        run: echo "name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Assemble the release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android ${{ steps.version.outputs.name }}
          body: |
            Release APK for ${{ github.sha }}.

            Obtainium should track the asset named `app-release.apk`.
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
