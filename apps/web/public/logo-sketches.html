<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo sketches</title>
    <style>
      :root {
        color-scheme: dark;
        --paper: #161410;
        --paper-2: #221f1b;
        --ink: #f3efe6;
        --muted: #b7aea0;
        --line: #3a342c;
        --cream: #f4f7f2;
        --leaf: #3d9a6e;
        --deep: #1f6b4a;
        --brass: #c4a574;
        --light-paper: #f3efe4;
        --light-ink: #1c1915;
        --light-muted: #5e584e;
        --light-line: #ddd4c4;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Avenir Next", "Source Sans 3", sans-serif;
      }

      header, main { width: min(880px, calc(100% - 32px)); margin: 0 auto; }
      header { padding: 36px 0 8px; }
      h1 { margin: 0; font-family: Palatino, Georgia, serif; font-size: 40px; font-weight: 500; }
      header p { max-width: 38rem; color: var(--muted); line-height: 1.45; }

      article { padding: 28px 0 8px; border-top: 1px solid var(--line); }
      h2 { margin: 0 0 6px; font-family: Palatino, Georgia, serif; font-size: 28px; font-weight: 500; }
      article > p { margin: 0 0 16px; color: var(--muted); }

      .band { display: flex; gap: 28px; align-items: end; padding: 18px; border-radius: 16px; }
      .band + .band { margin-top: 10px; }
      .band.dark { background: var(--paper-2); }
      .band.light { background: var(--light-paper); color: var(--light-ink); }
      .sample { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .sample span { font-size: 12px; letter-spacing: 0.02em; color: var(--muted); }
      .band.light .sample span { color: var(--light-muted); }

      .icon {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--leaf);
      }
      .icon svg { width: 100%; height: 100%; display: block; }
      .icon.paper { background: var(--paper); border: 1px solid var(--line); }
      .icon.paper svg { width: 86%; height: 86%; }
      .band.light .icon:not(.paper) { background: var(--deep); }
    </style>
  </head>
  <body>
    <header>
      <h1>Logo sketches</h1>
      <p>Five to choose from. 36 is the phone header. 16 is the favicon. 40 is the sign-in mark. The icon in the app is unchanged.</p>
    </header>
    <main id="board"></main>
    <script>
      const cream = '#f4f7f2';

      const pinwheel = `<g transform="translate(59 0) scale(-1 1)">
        <path fill="#c4a574" d="M14.75 13.41c8.146 0 14.75 6.603 14.75 14.75v1.34H1.34C.6 29.5 0 28.9 0 28.16c0-8.147 6.604-14.75 14.75-14.75z"/>
        <path fill="#1f6b4a" d="M45.59 14.75c0 8.146-6.603 14.75-14.75 14.75H29.5V1.34C29.5.6 30.1 0 30.84 0c8.147 0 14.75 6.604 14.75 14.75z"/>
        <path fill="#f4f7f2" d="M44.25 45.59c-8.146 0-14.75-6.603-14.75-14.75V29.5h28.16c.74 0 1.34.6 1.34 1.34 0 8.147-6.604 14.75-14.75 14.75z"/>
        <path fill="#3d9a6e" d="M13.41 44.25c0-8.146 6.603-14.75 14.75-14.75h1.34v28.16c0 .74-.6 1.34-1.34 1.34-8.147 0-14.75-6.604-14.75-14.75z"/>
      </g>`;

      const shutter = (id) => `<defs><mask id="${id}">
          <rect width="32" height="32" fill="#000"/>
          <circle cx="16" cy="16" r="12.4" fill="#fff"/>
          <circle cx="16" cy="16" r="3.5" fill="#000"/>
        </mask></defs>
        <g mask="url(#${id})" fill="${cream}">
          <circle cx="16" cy="6.6" r="7.5"/>
          <circle cx="24.1" cy="20.7" r="7.5"/>
          <circle cx="7.9" cy="20.7" r="7.5"/>
        </g>`;

      const film = `<path fill="${cream}" fill-rule="evenodd" d="M3 8.2h26a2 2 0 0 1 2 2v11.6a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V10.2a2 2 0 0 1 2-2zm6.3 2.5h13.4a1.2 1.2 0 0 1 1.2 1.2v8.2a1.2 1.2 0 0 1-1.2 1.2H9.3a1.2 1.2 0 0 1-1.2-1.2v-8.2a1.2 1.2 0 0 1 1.2-1.2zM4.1 11.2h2.9v3.5H4.1zm0 6.1h2.9V21H4.1zm20.9-6.1h2.9v3.5h-2.9zm0 6.1h2.9V21h-2.9z"/>`;

      const polaroid = `<path fill="${cream}" fill-rule="evenodd" d="M6.2 3.4h19.6a2.2 2.2 0 0 1 2.2 2.2v19.2a2.2 2.2 0 0 1-2.2 2.2H6.2A2.2 2.2 0 0 1 4 24.8V5.6a2.2 2.2 0 0 1 2.2-2.2zm2.3 2.3h15a1.3 1.3 0 0 1 1.3 1.3v12.2a1.3 1.3 0 0 1-1.3 1.3h-15a1.3 1.3 0 0 1-1.3-1.3V7a1.3 1.3 0 0 1 1.3-1.3z"/>
        <circle fill="${cream}" cx="19.8" cy="10.2" r="2.8"/>
        <path fill="${cream}" d="M7.2 17.6Q16 14.8 24.8 17.6V20.5H7.2Z"/>`;

      const album = (key) => {
        const green = String(key).startsWith('light') ? '#1f6b4a' : '#3d9a6e';
        return `<rect x="11" y="3.2" width="17.2" height="20.4" rx="2.2" fill="${cream}"/>
          <rect x="4" y="7.4" width="18.6" height="21.2" rx="2.3" fill="${cream}"/>
          <circle cx="13.3" cy="17.8" r="5.1" fill="${green}"/>`;
      };

      const ideas = [
        {
          n: '1',
          name: 'Flipped pinwheel',
          note: 'Four blades, mirrored, in brass, deep green, cream, and leaf. It sits on dark paper in both themes.',
          paper: true,
          view: '0 0 59 59',
          body: pinwheel,
        },
        {
          n: '3',
          name: 'Shutter',
          note: 'Three cream blades on the green tile, with a hole in the middle.',
          view: '0 0 32 32',
          body: shutter,
        },
        {
          n: '4',
          name: 'Film frame',
          note: 'A cream frame, a hollow picture, and two sprocket holes on each side.',
          view: '0 0 32 32',
          body: film,
        },
        {
          n: '5',
          name: 'Fat polaroid',
          note: 'The print fills the tile. Thick cream border, deep bottom edge, sun and hill in the window.',
          view: '0 0 32 32',
          body: polaroid,
        },
        {
          n: '7',
          name: 'Album',
          note: 'A cream book with the back cover peeking out, and a round photo on the front.',
          view: '0 0 32 32',
          body: album,
        },
      ];

      const sizes = [
        ['16', 16, 6],
        ['36', 36, 13],
        ['40', 40, 13],
        ['120', 120, 38],
      ];

      const board = document.getElementById('board');
      for (const idea of ideas) {
        const article = document.createElement('article');
        article.id = 'idea-' + idea.n;
        article.innerHTML = `<h2>${idea.n}. ${idea.name}</h2><p>${idea.note}</p>`;
        for (const theme of ['dark', 'light']) {
          const band = document.createElement('div');
          band.className = 'band ' + theme;
          for (const [label, px, radius] of sizes) {
            const sample = document.createElement('div');
            sample.className = 'sample';
            const icon = document.createElement('div');
            icon.className = 'icon' + (idea.paper ? ' paper' : '');
            icon.style.width = px + 'px';
            icon.style.height = px + 'px';
            icon.style.borderRadius = radius + 'px';
            const body = typeof idea.body === 'function' ? idea.body(theme + '-' + label) : idea.body;
            icon.innerHTML = `<svg viewBox="${idea.view}" aria-hidden="true">${body}</svg>`;
            const caption = document.createElement('span');
            caption.textContent = label;
            sample.append(icon, caption);
            band.append(sample);
          }
          article.append(band);
        }
        board.append(article);
      }
    </script>
  </body>
</html>
